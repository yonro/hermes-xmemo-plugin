name: xmemo
version: 1.1.3
description: "XMemo — native Hermes memory provider for user-owned cloud memory, orchestrated recall, semantic search, durable fact storage, working state, and session snapshots."
pip_dependencies:
  - httpx
hooks:
  - on_session_end
provides_tools:
  - xmemo_search
  - xmemo_get
  - xmemo_list
